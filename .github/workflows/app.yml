name: App

# The checks and image build every swhurl app runs, shared from the template: each app's
# .github/workflows/container.yml calls this file at
# samclement/swhurl-app-template-typescript/.github/workflows/app.yml@main, so a fix here reaches
# every app on its next run (like renovate-preset.json). Pull requests: type-check, test, build the
# image and smoke-test it (it starts, answers /healthz and keeps running). Pushes to main then push
# the image to GHCR tagged <run number>-<short sha> (for example 42-a1b2c3d); the platform's image
# automation deploys the highest run number to staging, and the job summary prints image@digest.
# The template's own Template workflow calls it with template: true: it renders the template with
# Copier into ./app (as the platform's make app-repo does), checks and smoke-tests that, and publishes
# nothing.

on:
  workflow_call:
    inputs:
      template:
        description: Render the Copier template into ./app and check that instead (publishes nothing)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Check, build and smoke-test
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ inputs.template && 'app' || '.' }}
      PUBLISH: ${{ !inputs.template && github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: ${{ inputs.template && 'app' || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv (template only)
        if: inputs.template
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Render the template (template only)
        if: inputs.template
        working-directory: .
        run: |
          uvx copier@9.18.2 copy --defaults --vcs-ref HEAD --data app_name=smoke-app . app
          test -f app/.copier-answers.yml && test -f app/swhurl.yaml && grep -q '^# smoke-app$' app/README.md

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Type-check, build and test
        run: |
          npm ci
          npm run check
          npm run build
          npm test --if-present

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          load: true
          tags: app:smoke
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Smoke test (starts, answers /healthz, keeps running)
        run: |
          set -Eeuo pipefail
          docker run -d --name smoke -p 18080:8080 --read-only --tmpfs /tmp app:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null || { docker logs smoke; exit 1; }
          sleep 10
          [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { docker logs smoke; exit 1; }
          echo "smoke test passed"

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Record the image
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Staging instances created with the swhurl presets deploy this automatically. For a new"
            echo "instance, paste the line above into the console's New app Image field."
          } >> "$GITHUB_STEP_SUMMARY"
