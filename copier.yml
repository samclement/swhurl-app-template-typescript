# Copier template for a swhurl TypeScript app. The platform renders it with
# `make app-repo NAME=<app>` (swhurl-platform), which then creates the repository.
# By hand: uvx copier copy --data app_name=<app> gh:samclement/swhurl-app-template-typescript <dir>
_min_copier_version: "9.18"
_subdirectory: template
_answers_file: .copier-answers.yml

app_name:
  type: str
  help: The app's name (its repository, image and platform name)
  validator: >-
    {% if not (app_name | regex_search('^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$')) %}
    must be a DNS label: lowercase letters, digits and hyphens, at most 40 characters
    {% endif %}

description:
  type: str
  help: One line saying what the app does
  default: A swhurl app
  validator: >-
    {% if description | length > 200 or description != (description.split() | join(' ')) %}
    must be one line of at most 200 characters, without leading, trailing or repeated spaces
    {% endif %}

kind:
  type: str
  help: "web: an HTTP service with a health endpoint; worker: a background process with no web address; job: a run on a schedule that does its work and exits"
  choices:
    web: web
    worker: worker
    job: job
  default: web

database:
  type: str
  help: "sqlite: a database file the platform keeps on a volume, backed up nightly, with migrations at startup (web apps and APIs; a worker or a job keeps what it needs in an API it calls)"
  choices:
    none: none
    sqlite: sqlite
  default: "{{ 'sqlite' if kind == 'web' else 'none' }}"

api:
  type: str
  help: "openapi: describes the app's HTTP API in openapi.json, generated from its routes, so other apps can find and call it (web only)"
  choices:
    none: none
    openapi: openapi
  default: "{{ 'openapi' if kind == 'web' else 'none' }}"

frontend:
  type: str
  help: "vite: a browser frontend in web/, built with Vite+ and served by the app at /; it calls the app's own /api/* as the signed-in person (web only)"
  choices:
    none: none
    vite: vite
  default: none
  # The last question: the answers together must be one of the platform's app types
  # (swhurl-platform tools/swhurl/apps/contract.py APP_TYPES), the only sets this template's CI builds.
  # A type whose answers change keeps its old set here until no app records it.
  validator: >-
    {% set answers = [kind, database, api, frontend] | join(' ') %}
    {% if answers not in ['web sqlite openapi vite', 'web sqlite openapi none', 'worker none none none',
                          'job none none none'] %}
    kind={{ kind }} database={{ database }} api={{ api }} frontend={{ frontend }} is not an app type:
    web-app (web sqlite openapi vite), api (web sqlite openapi none), worker (worker none none none)
    or scheduled-job (job none none none)
    {% endif %}
