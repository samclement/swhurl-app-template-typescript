<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 2rem 1rem;
        color: #1f2328;
        background: #f6f8fa;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 1.5rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0 0 0.75rem;
      }
      .muted {
        color: #59636e;
      }

  <body>
    <main>
      <h1 id="title">Loading…</h1>
      <dl>
        <dt>Signed in as</dt>
        <dd id="who" class="muted">…</dd>
        <dt>Feature flags</dt>
        <dd id="flags" class="muted">…</dd>
      </dl>
      <p class="muted">
        An example to replace: <code>web/main.ts</code> calls this app's <code>/api/hello</code> and
        <code>/api/flags</code>.
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
